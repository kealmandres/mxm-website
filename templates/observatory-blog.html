<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Future Observatory Blog | The MaCHiNE MaiSON</title>
    <meta
      name="description"
      content="Articles from the Future Observatory, MxM's futurism wing, by Marissa Kos. MxM (The MaCHiNE MaiSON) is Australia's first AI agency."
    />

    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="Future Observatory Blog | The MaCHiNE MaiSON" />
    <meta
      property="og:description"
      content="Articles from the Future Observatory, MxM's futurism wing, by Marissa Kos."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.themxm.ai/future-observatory/blog/" />
    <meta property="og:image" content="https://www.themxm.ai/assets/images/rooms/observatory-2.webp" />

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Future Observatory Blog | The MaCHiNE MaiSON" />
    <meta
      name="twitter:description"
      content="Articles from the Future Observatory, MxM's futurism wing, by Marissa Kos."
    />
    <meta name="twitter:image" content="https://www.themxm.ai/assets/images/rooms/observatory-2.webp" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://www.themxm.ai/future-observatory/blog/" />

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/assets/images/mxm-logo.ico" />

    <link rel="stylesheet" href="/assets/css/fonts.css" />
    <link rel="stylesheet" href="/assets/css/future-observatory-page.css" />
    <link rel="stylesheet" href="/assets/css/testimonials.css" />
    <!-- Persistent Music Player Styles -->
    <link rel="stylesheet" href="/assets/css/persistent-music-player.css" />
    <!-- Cookie Consent Styles -->
    <link rel="stylesheet" href="/assets/css/cookie-consent.css" />
    <!-- In-text link hover, as on the Lair of the Blonde Bot page -->
    <style>
      .room-description-link:hover {
        border-bottom-color: #fff;
        text-shadow: 0 0 8px rgba(255,255,255,0.5);
      }
      /* Section spacing as on the Future Observatory room: drop the last item's own margin
         so only the room's bottom padding sits below the content */
      .artificial-ingenious main .page-section .container > :last-child,
      .artificial-ingenious main .page-section .container > :last-child > :last-child {
        margin-bottom: 0;
      }
      /* Keep the footer at the bottom of short pages (every other body child is position: fixed) */
      body.detail-page.artificial-ingenious {
        min-height: 100vh;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
      }
      .artificial-ingenious main {
        flex: 1 0 auto;
      }
    </style>
  </head>
  <body class="detail-page artificial-ingenious persistent-music-active">
    <!-- Required Audio Element for Persistent Music Player -->
    <audio id="background-music" loop preload="auto">
      <source src="/assets/audio/background-music.webm" type="audio/webm" />
      Your browser does not support the audio element.
    </audio>

    <!-- Persistent Music Player Controls -->
    <div class="persistent-music-controls">
      <!-- Main Player Control -->
      <div class="persistent-music-player">
        <button
          id="play-pause-btn"
          data-play-text="▶"
          data-pause-text="⏸"
          aria-label="Play/Pause music"
        >
          ▶
        </button>
        <span class="music-status-label">MxM Mix</span>
        <button
          class="volume-toggle-btn"
          id="volume-toggle-btn"
          aria-label="Toggle volume control"
        >
          VOL
        </button>
      </div>

      <!-- Volume Control -->
      <div class="volume-control-container" id="volume-control-container">
        <span class="volume-icon">♪</span>
        <input
          type="range"
          id="volume-slider"
          min="0"
          max="1"
          step="0.05"
          value="0.5"
          aria-label="Volume control"
        />
        <span class="volume-display">50%</span>
      </div>
    </div>

    <div id="dynamic-page-background"></div>
    <div id="process-scroll-animation-host"></div>
    <div class="hero-background-slideshow">
      <img
        src="/assets/images/rooms/observatory-2.webp"
        alt="Artificial Ingenious Background Slide 1"
        class="hero-bg-slide"
      />
      <img
        src="/assets/images/future-observatory/backgrounds/BG1.webp"
        alt="Artificial Ingenious Background Slide 3"
        class="hero-bg-slide"
      />
      <img
        src="/assets/images/future-observatory/backgrounds/BG2.webp"
        alt="Artificial Ingenious Background Slide 3"
        class="hero-bg-slide"
      />
      <img
        src="/assets/images/future-observatory/backgrounds/BG3.webp"
        alt="Artificial Ingenious Background Slide 3"
        class="hero-bg-slide"
      />
    </div>
    <!-- Room-specific 3D elements will be added via JavaScript -->
    <div class="floating-elements-container"></div>

    <!-- Return to Homepage Button -->
    <a href="/" class="return-to-maison">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M19 12H5M12 19l-7-7 7-7" />
      </svg>
      Return to MaCHiNE MaiSON
    </a>

    <main>
      <section class="page-section">
        <div class="container">
          <h1 class="section-title" style="text-transform: uppercase">Future Observatory Blog</h1>
          <p>
            Articles from the Future Observatory, MxM's futurism wing, by
            Marissa Kos.
          </p>
        </div>
      </section>

      <section class="page-section">
        <div class="container">
          <!-- articles:start (written by scripts/publish-article.mjs) -->
          <p>No articles have been published yet.</p>
          <!-- articles:end -->
        </div>
      </section>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <div class="container">
        <div class="footer-content">
          <!-- <div class="footer-logo">MaCHiNE x MaiSON</div> -->
          <div class="footer-nav">
            <a href="/">Home</a>
            <a href="/contact">Contact</a>
            <a href="/about">About</a>
            <a href="/privacy-policy">Privacy Policy</a>
            <a href="/terms-of-service">Terms of Service</a>
          </div>
          <div class="footer-copyright">
            © 2025 MaCHiNE x MaiSON. All rights reserved.
          </div>
        </div>
      </div>
    </footer>

    <!-- Scripts -->
    <script src="/assets/js/chat.js" defer></script>

    <!-- Cookie Consent Script -->
    <script src="/assets/js/cookie-consent.js" defer></script>
    <!-- Persistent Music Player Script -->
    <script src="/assets/js/persistent-music-player.js" defer></script>

    <script src="/assets/js/performance-optimizer.js" defer></script>

    <!-- Volume Display Update Script -->
    <script>
      // Update volume display in real-time
      const volumeSlider = document.getElementById("volume-slider");
      const volumeDisplay = document.querySelector(".volume-display");

      if (volumeSlider && volumeDisplay) {
        volumeSlider.addEventListener("input", function () {
          volumeDisplay.textContent = Math.round(this.value * 100) + "%";
        });
      }

      // Update music status label based on playback state
      function updateMusicLabel() {
        const label = document.querySelector(".music-status-label");
        if (window.persistentMusicPlayer && label) {
          const isPlaying = window.persistentMusicPlayer.isPlaying();
          label.textContent = isPlaying ? "MxM Mix ♪" : "MxM Mix";
        }
      }

      // Update label every second
      setInterval(updateMusicLabel, 1000);

      // Suppress Chrome Cast extension errors that are harmless
      window.addEventListener("error", function (event) {
        if (
          event.message &&
          event.message.includes("chrome-extension://invalid/")
        ) {
          event.preventDefault();
          return true;
        }
        if (event.filename && event.filename.includes("cast_sender.js")) {
          event.preventDefault();
          return true;
        }
      });
    </script>
  </body>
</html>
