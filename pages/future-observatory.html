        <form id="crystalCubeForm" name="sentMessage" novalidate="novalidate" style="max-width: 90%;">

            <label>

            <label>

            </label>
            
            <label>
                Question/Prediction (max 500 chars):
                <textarea id="crystalPrediction" name="message" maxlength="500" required="" placeholder="What future trend or technology would you like insights on?"></textarea>
            </label>

                    <option value="Healthcare">Healthcare</option>
                    <option value="Education">Education</option>
                    <option value="Retail">Retail</option>
                    <option value="Manufacturing">Manufacturing</option>
                    <option value="Entertainment">Entertainment</option>
                    <option value="Other">Other</option>
                </select>
            </label>
            
            <label class="checkbox-label">

            <div class="submit-button-container">
